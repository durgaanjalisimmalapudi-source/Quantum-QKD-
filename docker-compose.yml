version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: qkd_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: qkd_platform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d qkd_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  quantum-engine:
    build:
      context: ./quantum-engine
      dockerfile_inline: |
        FROM python:3.11-slim
        WORKDIR /app
        COPY requirements.txt .
        RUN pip install --no-cache-dir -r requirements.txt
        COPY . .
        EXPOSE 8000
        CMD ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
    container_name: qkd_quantum_engine
    restart: unless-stopped
    ports:
      - "8000:8000"

  backend:
    build:
      context: ./backend
      dockerfile_inline: |
        FROM node:20-alpine
        WORKDIR /app
        COPY package*.json ./
        RUN npm install
        COPY . .
        EXPOSE 5000
        CMD ["node", "server.js"]
    container_name: qkd_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/qkd_platform
      QUANTUM_ENGINE_URL: http://quantum-engine:8000
      QUANTUM_ENGINE_WS_URL: ws://quantum-engine:8000
    depends_on:
      postgres:
        condition: service_healthy
      quantum-engine:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile_inline: |
        FROM node:20-alpine
        WORKDIR /app
        COPY package*.json ./
        RUN npm install
        COPY . .
        EXPOSE 3000
        CMD ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "3000"]
    container_name: qkd_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:

